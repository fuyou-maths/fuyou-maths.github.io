<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>document.documentElement.classList.add('js');</script>
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem("fuyou-theme"); } catch (e) {}
      if (!t) t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <title>404 · 蜉蝣</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css?v=7">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html" aria-label="返回首页">
        <span class="brand-mark" aria-hidden="true">蜉</span>
        <span class="brand-text">蜉蝣</span>
      </a>
    </div>
  </header>

  <main id="main">
    <section class="section notfound">
      <div class="container notfound-copy">
        <p class="notfound-code">404</p>
        <h1 class="notfound-title">此路不通</h1>
        <p class="notfound-desc">页面走散了。朝生暮死，蜉蝣还要向光而行——</p>
        <div class="hero-actions">
          <a class="btn btn-primary" href="index.html">返回首页</a>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p class="footer-poem">蜉蝣之羽，衣裳楚楚。</p>
      <p>© 2026 蜉蝣 · <a href="index.html">返回首页</a></p>
    </div>
  </footer>

  <style>
    .notfound { min-height: 62vh; display: flex; align-items: center; }
    .notfound-copy { text-align: center; }
    .notfound-code {
      font-family: var(--mono, monospace);
      font-size: clamp(72px, 14vw, 128px);
      line-height: 1; letter-spacing: 8px; margin: 0 0 10px;
      color: var(--ink-faint, #9a909f);
    }
    .notfound-title { font-size: clamp(28px, 5vw, 40px); margin: 0 0 18px; }
    .notfound-desc { color: var(--ink-soft); margin: 0 0 34px; }
    .notfound .hero-actions { justify-content: center; }
  </style>
</body>
</html>
